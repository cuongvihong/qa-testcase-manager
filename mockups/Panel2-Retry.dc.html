<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Panel 2 - Tab Retry cua Test Case</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  body{margin:0;font-family:'Public Sans',system-ui,sans-serif;background:#FAFAF8}
  button{font-family:inherit;cursor:pointer}
</style>
</helmet>

<div style="width:440px;height:900px;box-sizing:border-box;display:flex;flex-direction:column;background:#FAFAF8;color:#1B1B18;overflow:hidden;">

  <div style="flex:0 0 auto;padding:16px 20px 0 20px;">
    <div style="font-size:11.5px;color:#84817A;margin-bottom:4px;">UI Test / Bo test dang nhap</div>
    <div style="font-size:15px;font-weight:700;color:#1B1B18;line-height:1.3;margin-bottom:12px;">Dang nhap sai mat khau 3 lan</div>
  </div>

  <div style="flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:0 20px;border-bottom:1px solid #E4E1DA;">
    <button style="padding:10px 4px;margin-right:18px;border:none;background:transparent;font-size:12.5px;color:#84817A;border-bottom:2px solid transparent;">Status</button>
    <button style="padding:10px 4px;margin-right:18px;border:none;background:transparent;font-size:12.5px;color:#84817A;border-bottom:2px solid transparent;">Timeline</button>
    <button style="padding:10px 4px;border:none;background:transparent;font-size:12.5px;font-weight:700;color:#1B1B18;border-bottom:2px solid #3B5BDB;">Retry</button>
  </div>

  <div style="flex:1 1 auto;overflow-y:auto;padding:18px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;">

    <button style="display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border:none;border-radius:8px;background:#3B5BDB;color:#FFFFFF;font-size:13px;font-weight:600;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
      Chay lai ngay (Retry)
    </button>

    <div style="display:flex;gap:10px;padding:10px 12px;background:#FFF9DB;border:1px solid #FFE8A3;border-radius:8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E8590C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;margin-top:1px;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      <div style="font-size:11.5px;color:#8A4B00;line-height:1.5;">Canh bao Flaky Test: case nay cho ket qua khong on dinh, 2 lan Pass va 2 lan Fail trong 4 lan chay gan nhat.</div>
    </div>

    <div>
      <div style="font-size:11px;letter-spacing:0.5px;text-transform:uppercase;color:#84817A;margin-bottom:8px;">Da retry 2 lan</div>

      <div style="display:flex;flex-direction:column;border:1px solid #E4E1DA;border-radius:10px;overflow:hidden;background:#FFFFFF;">

        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #F0EEE9;">
          <span style="font-size:11px;color:#84817A;width:56px;flex:0 0 auto;">Goc</span>
          <span style="font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:#FFF5F5;color:#C92A2A;flex:0 0 auto;">Fail</span>
          <div style="flex-grow:1;">
            <div style="font-size:11.5px;color:#84817A;font-family:'IBM Plex Mono',monospace;">20/09/2026, 10:05 &middot; 5.0s</div>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #F0EEE9;">
          <span style="font-size:11px;color:#84817A;width:56px;flex:0 0 auto;">Retry 1</span>
          <span style="font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:#EBFBEE;color:#2B8A3E;flex:0 0 auto;">Pass</span>
          <div style="flex-grow:1;">
            <div style="font-size:11.5px;color:#84817A;font-family:'IBM Plex Mono',monospace;">20/09/2026, 10:07 &middot; 2.1s</div>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;">
          <span style="font-size:11px;color:#84817A;width:56px;flex:0 0 auto;">Retry 2</span>
          <span style="font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:#FFF5F5;color:#C92A2A;flex:0 0 auto;">Fail</span>
          <div style="flex-grow:1;">
            <div style="font-size:11.5px;color:#84817A;font-family:'IBM Plex Mono',monospace;">20/09/2026, 14:32 &middot; 4.6s</div>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
